<div th:fragment="content">
    <div class="container mt-4 mb-5">
        
        <div class="card border-0 shadow-sm mb-4" style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white;">
            <div class="card-body p-4 d-flex align-items-center">
                <div class="bg-white text-primary d-flex align-items-center justify-content-center fw-bold shadow"
                     style="width: 100px; height: 100px; border-radius: 50%; font-size: 2.5rem;">
                     <span th:text="${#strings.substring(tacGia.tenDangNhap, 0, 1).toUpperCase()}"></span>
                </div>
                
                <div class="ms-4">
                    <h2 class="fw-bold mb-1" th:text="${tacGia.tenDangNhap}">Tên Tác Giả</h2>
                             
                    <div class="d-flex gap-4 mt-3">
                        <div class="text-center">
                            <h4 class="fw-bold mb-0 text-warning" th:text="${tongTruyen}">0</h4>
                            <small class="text-white-50 text-uppercase" style="letter-spacing: 1px;">Truyện đã đăng</small>
                        </div>
                        <div class="text-center">
                            <h4 class="fw-bold mb-0 text-danger" th:text="${tongLike}">0</h4>
                            <small class="text-white-50 text-uppercase" style="letter-spacing: 1px;">Tổng lượt thích</small>
                        </div>
                    </div>
                </div>
                <div class="ms-auto d-flex gap-2 mt-3 mt-md-0" th:if="${currentUser != null and currentUser.id == tacGia.id}">
                    <a th:href="@{/DustNovel/themtruyen}" class="btn btn-light text-success fw-bold shadow-sm d-flex align-items-center gap-2">
                        <i class="bi bi-plus-circle-fill fs-5"></i> Thêm truyện
                    </a>
                    <button type="button" class="btn btn-light text-danger fw-bold shadow-sm d-flex align-items-center gap-2" 
                            data-bs-toggle="modal" data-bs-target="#xoaNhieuTruyenModal">
                        <i class="bi bi-trash3-fill fs-5"></i> Xóa hàng loạt
                    </button>
                    <a th:href="@{/dbu/doanh-thu}" class="btn btn-light text-primary fw-bold shadow-sm d-flex align-items-center gap-2">
                        <i class="bi bi-graph-up-arrow fs-5"></i> Doanh thu
                    </a>
                </div>
            </div>
        </div>

        <h4 class="fw-bold mb-3 border-bottom pb-2">
            <i class="fa-solid fa-book-bookmark text-primary me-2"></i>Tác phẩm đã đăng
        </h4>

        <div th:if="${#lists.isEmpty(pageTruyen.content)}" class="text-center text-muted py-5">
            <i class="fa-solid fa-box-open fs-1 mb-3 text-secondary"></i>
            <p>Tác giả này chưa đăng bộ truyện nào.</p>
        </div>

        <div th:if="${not #lists.isEmpty(pageTruyen.content)}">
            <div class="row g-4">
                <div class="col-md-6 col-lg-3" th:each="truyen : ${pageTruyen.content}">
                    <div class="card h-100 border-0 shadow-sm transition-hover" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='translateY(0)'">
                         <div style="overflow: hidden; border-radius: 6px 6px 0 0; cursor:pointer;" th:onclick="${truyen.tag18} ? 'requireAgeGate(event, \'/DustNovel/truyen/' + ${truyen.id} + '\')' : 'window.location.href=\'/DustNovel/truyen/' + ${truyen.id} + '\''">
                            <img th:src="${truyen.anhBia != null && !#strings.isEmpty(truyen.anhBia)} ? ${truyen.anhBia} : @{/images/aria.jpg}"
                                 class="card-img-top rounded-top"
                                 style="aspect-ratio:5/6; object-fit:cover; transition: 0.3s;"
                                 th:styleappend="${truyen.tag18 != null and truyen.tag18} ? 'filter: blur(12px) brightness(0.85); transform: scale(1.1);' : ''">
                        </div>
                        <div class="card-body d-flex flex-column">
                            <a th:href="@{/DustNovel/truyen/{id}(id=${truyen.id})}" class="text-decoration-none">
                                <h6 class="card-title fw-bold text-dark text-truncate" th:text="${truyen.tenTruyen}">Tên truyện</h6>
                            </a>
                            <div class="mt-auto">
                                <span class="badge bg-success mb-2" th:text="${truyen.trangThai}">Trạng thái</span>
                               
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-5">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                        <a class="page-link shadow-none" th:href="@{/DustNovel/ho-so/{id}(id=${tacGia.id}, page=${currentPage - 1})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i ? 'active' : ''}">
                        <a class="page-link shadow-none" th:href="@{/DustNovel/ho-so/{id}(id=${tacGia.id}, page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                        <a class="page-link shadow-none" th:href="@{/DustNovel/ho-so/{id}(id=${tacGia.id}, page=${currentPage + 1})}">Sau</a>
                    </li>
                </ul>
            </nav>
            <div th:replace="~{truyen/XacMinhTuoi :: ageGate(${currentUser})}"></div>
        </div>
        
    </div>
			<div th:replace="~{user/xoa-nhieu-truyen :: xoaNhieuTruyenModal(${tatCaTruyen})}"></div>
</div>
