<div th:fragment="content">

<style>
    body {
        background: linear-gradient(135deg, #eef2ff, #fdf4ff);
    }

    .gift-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .gift-card {
        width: 100%;
        max-width: 420px;
        border-radius: 20px;
        padding: 40px 30px;
        background: #ffffff;
        color: #1e293b !important; /* FIX DARK MODE */
        box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        text-align: center;
    }

    /* FIX: không cho CSS ngoài phá */
    .gift-card * {
        color: inherit !important;
    }

    .gift-icon {
        width: 70px;
        height: 70px;
        margin: -60px auto 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 20px rgba(99,102,241,0.4);
    }

    .gift-title {
        font-weight: 700;
        font-size: 24px;
        margin-bottom: 5px;
    }

    .gift-sub {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 25px;
    }

    .code-input {
        border-radius: 12px;
        border: 2px solid #e5e7eb;
        text-align: center;
        padding: 12px;
        font-weight: 600;
        letter-spacing: 2px;
        color: #1e293b;
        transition: 0.2s;
    }

    .code-input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    .btn-main {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white !important;
        border: none;
        border-radius: 999px;
        padding: 12px;
        font-weight: 600;
        margin-top: 15px;
        transition: 0.2s;
    }

    .btn-main:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(99,102,241,0.4);
    }

    .btn-back {
        margin-top: 12px;
        border-radius: 999px;
        padding: 10px;
        border: 1px solid #cbd5f5;
        color: #4f46e5 !important;
        background: transparent;
        transition: 0.2s;
    }

    .btn-back:hover {
        background: #eef2ff;
    }

    .note {
        margin-top: 20px;
        font-size: 12px;
        color: #94a3b8;
    }
</style>

<div class="gift-wrapper">
    <div class="gift-card">

        <!-- ICON -->
        <div class="gift-icon">
            <svg width="28" height="28" fill="white" viewBox="0 0 24 24">
                <path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/>
                <path d="M2 7h20v5H2z"/>
                <path d="M12 22V7"/>
                <path d="M12 7c-1.5 0-4-1-4-3a2 2 0 0 1 4 0v3z"/>
                <path d="M12 7c1.5 0 4-1 4-3a2 2 0 0 0-4 0v3z"/>
            </svg>
        </div>

        <div class="gift-title">Đổi Mã Thưởng</div>
        <div class="gift-sub">Nhập giftcode để nhận thưởng</div>

        <!-- ALERT -->
        <div th:if="${successMsg}" class="alert alert-success text-start small">
            <span th:text="${successMsg}"></span>
        </div>

        <div th:if="${errorMsg}" class="alert alert-danger text-start small">
            <span th:text="${errorMsg}"></span>
        </div>

        <!-- FORM -->
        <form th:action="@{/ma-thuong/nhap-code}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <input type="text" name="code"
                   class="form-control code-input"
                   placeholder="NHẬP MÃ..."
                   required>

            <button class="btn btn-main w-100">Xác nhận</button>
        </form>

        <!-- BACK BUTTON -->
        <a href="/DustNovel/user/profile" class="btn btn-back w-100">
            ← Quay lại trang cá nhân
        </a>

        <div class="note">
            Mỗi mã chỉ dùng 1 lần
        </div>

    </div>
</div>

</div>
