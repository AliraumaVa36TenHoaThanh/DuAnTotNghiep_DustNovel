<div xmlns:th="http://www.thymeleaf.org" th:fragment="content">

<div id="main">
    <div class="page-heading">

        <!-- TITLE -->
        <div class="page-title mb-4">
            <h3>Quản lý doanh thu</h3>
        </div>

        <section class="row">

            <!-- ================= CARD TỔNG QUAN ================= -->
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm text-center p-3">
                    <h6 class="text-muted">Tổng ngày có doanh thu</h6>
                    <h3 th:text="${#lists.size(doanhThuNgay)}"></h3>
                </div>
            </div>
            <!-- ================= BIỂU ĐỒ ================= -->
            <div class="col-12 mt-3">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5>Biểu đồ doanh thu theo ngày</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
            </div>


            <!-- ================= 2 CỘT ================= -->
            <div class="col-md-6 mt-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5>Top người nạp nhiều</h5>
                    </div>

                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th class="text-end">Tiền</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="item, iStat : ${topNap}">
                                    <td>
                                        <span class="badge bg-primary me-2"
                                              th:text="${iStat.index + 1}"></span>
                                        <span th:text="${item[0]}"></span>
                                    </td>

                                    <td class="text-end text-success fw-bold"
                                        th:text="${#numbers.formatDecimal(item[1],0,'COMMA',0,'POINT')}">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>


            <!-- ================= TOP TOKEN ================= -->
            <div class="col-md-6 mt-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5>Top token</h5>
                    </div>

                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th class="text-end">Token</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="user, iStat : ${topToken}">
                                    <td>
                                        <span class="badge bg-warning me-2"
                                              th:text="${iStat.index + 1}"></span>
                                        <span th:text="${user.tenDangNhap}"></span>
                                    </td>

                                    <td class="text-end fw-bold text-warning"
                                        th:text="${user.token}">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </section>
    </div>
</div>

<!-- ================= CHART JS ================= -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script th:inline="javascript">
    const labels = [[${doanhThuNgay}]].map(item => item[0]);
    const data = [[${doanhThuNgay}]].map(item => item[1]);

    const ctx = document.getElementById('revenueChart');

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Doanh thu',
                data: data,
                tension: 0.3,
                fill: true
            }]
        }
    });
</script>

</div>
