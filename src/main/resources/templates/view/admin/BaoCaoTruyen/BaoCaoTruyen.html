<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Quản lý báo cáo truyện</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
/* ==================== CSS TÙY CHỈNH ==================== */
tbody tr:hover { background-color: #eeeeee; }

/* Căn chỉnh không đè Sidebar */
.main-content { margin-left: 260px; padding: 30px; }

.card {
	background: #ffffff; border-radius: 12px;
	box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
	padding: 20px; margin-left: 40px; 
}
.card-top { margin-bottom: 30px; }

.page-title { font-size: 22px; font-weight: 600; margin-bottom: 15px; }

.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

.search-box { display: flex; gap: 10px; margin-right: 30px; }
.search-box input {
	padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc;
	width: 290px; margin-right: 5px;
}

table { width: 100%; border-collapse: collapse; background: #ffffff; }
thead { background: #f1f3f5; }
th, td { padding: 14px; border-bottom: 1px solid #e0e0e0; }
th { text-align: left; }

.badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; display: inline-block; }
.badge-hoatdong { background: #d4f4dd; color: #1f7a3f; } 
.badge-tamkhoa { background: #fff3cd; color: #b45309; }  
.badge-danger { background: #f8d7da; color: #842029; }   

.action-btn {
	display: inline-flex; align-items: center; justify-content: center;
	width: 34px; height: 34px; border-radius: 4px; color: #fff;
	text-decoration: none; margin: 0 2px; font-size: 16px; border: none; cursor: pointer; transition: 0.2s;
}

.btn-view { background: #0d6efd; }
.btn-view:hover { background: #0b5ed7; }
.btn-edit { background: #28a745; }
.btn-edit:hover { background: #218838; }
.btn-delete { background: #dc3545; }
.btn-delete:hover { background: #c82333; }
.btn-edit:disabled { background: #6c757d; cursor: not-allowed; }

.text-center { text-align: center; }
.empty { text-align: center; color: #777; font-style: italic; }

.d-flex { display: flex; }
.align-items-center { align-items: center; }
.gap-3 { gap: 20px; }
.gap-2 { gap: 10px; }
.mb-3 { margin-bottom: 20px; }
.mb-0 { margin-bottom: 0; }
.mt-3 { margin-top: 20px; }
.justify-content-center { justify-content: center; }

.form-select { padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; cursor: pointer;}
.form-select-sm { padding: 4px 8px; font-size: 13px; }

/* Phân trang */
.pagination { list-style: none; display: flex; gap: 5px; padding: 0; margin: 20px 0 0 0; justify-content: center; }
.pagination .page-item { display: inline-block; }
.pagination .page-link {
	display: inline-block; padding: 8px 12px; border: 1px solid #ddd;
	border-radius: 4px; background: #fff; color: #0d6efd; text-decoration: none;
	cursor: pointer; transition: 0.2s;
}
.pagination .page-link:hover { background: #0d6efd; color: #fff; }
.pagination .page-item.active .page-link { background: #0d6efd; color: #fff; border-color: #0d6efd; }
</style>


<div class="main-content" style="padding-top: 0;"> 
	<div class="card">
		<div class="page-title">Quản lý toàn bộ Báo cáo</div>

		<div class="toolbar">
			<span>Danh sách báo cáo từ tất cả người dùng</span>
			<div class="search-box">
				<input type="text" id="searchInput" placeholder="Tìm tên truyện hoặc người báo cáo...">
			</div>
		</div>

		<div class="d-flex align-items-center gap-3 mb-3">
            <div class="d-flex align-items-center gap-2">
                <label class="mb-0 fw-bold text-muted small">Hiển thị:</label>
                <select id="rowLimit" class="form-select form-select-sm" style="width: 80px;">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                </select>
            </div>

            <div class="d-flex align-items-center gap-2">
                <label class="mb-0 fw-bold text-muted small">Lọc lý do:</label>
                <select id="reasonFilter" class="form-select form-select-sm" style="width: 220px;">
                    <option value="all">-- Tất cả lý do --</option>
                    <option value="Dịch sai">Dịch sai / Dịch máy rác</option>
                    <option value="Dùng bìa truyện sai">Dùng bìa truyện sai</option>
                    <option value="Ăn cắp truyện của người khác">Ăn cắp truyện</option>
                    <option value="Khác">Lý do Khác</option>
                </select>
            </div>
		</div>

		<table>
			<thead>
				<tr>
					<th width="20%">Tên truyện</th>
					<th width="15%">Người báo cáo</th>
					<th width="25%">Lý do / Chi tiết</th>
					<th width="10%">Trạng thái</th>
					<th width="10%">Ngày gửi</th>
					<th class="text-center" width="20%">Quản lý</th>
				</tr>
			</thead>

			<tbody id="storyTable">
				<tr th:each="bc : ${reports}" th:attr="data-lydo=${bc.lyDo}">
					<td>
                        <a th:href="@{/DustNovel/truyen/{id}(id=${bc.truyenBiBaoCao.id})}" target="_blank" style="text-decoration: none; font-weight: 500; color: #111;">
                            [[${bc.truyenBiBaoCao.tenTruyen}]]
                        </a>
					</td>
					<td><b th:text="${bc.nguoiBaoCao.tenDangNhap}"></b></td>
					<td>
                        <span class="badge badge-danger" th:text="${bc.lyDo}"></span>
                        <div th:if="${bc.moTaChiTiet != null}" style="font-size: 12px; color: #666; margin-top: 4px; font-style: italic;" th:text="${bc.moTaChiTiet}"></div>
					</td>
					<td>
						<span th:if="${bc.trangThai == 'CHO_XU_LY'}" class="badge badge-tamkhoa">Chờ xử lý</span>
						<span th:if="${bc.trangThai == 'DA_GIAI_QUYET'}" class="badge badge-hoatdong">Đã xử lý</span>
					</td>
					<td th:text="${#temporals.format(bc.ngayBaoCao,'dd/MM/yyyy')}"></td>
					
                    <td class="text-center">
                        <div class="d-flex justify-content-center gap-1">
                            <a th:href="@{/DustNovel/truyen/{id}(id=${bc.truyenBiBaoCao.id})}" target="_blank" class="action-btn btn-view" title="Xem chi tiết truyện">
                                <i class="fa-solid fa-eye"></i>
                            </a>

                            <form th:action="@{/dba/bao-cao/xu-ly/{id}(id=${bc.id})}" method="post" style="display: inline-block;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="action-btn btn-edit" th:disabled="${bc.trangThai == 'DA_GIAI_QUYET'}" title="Đánh dấu đã xử lý">
                                    <i class="fa-solid fa-check"></i>
                                </button>
                            </form>
                            
                            <form th:action="@{/dba/bao-cao/xoa/{id}(id=${bc.id})}" method="post" style="display: inline-block;" onsubmit="return confirm('Bạn chắc chắn muốn xóa báo cáo này chứ?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="action-btn btn-delete" title="Xóa báo cáo">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </form>
                        </div>
					</td>
				</tr>

				<tr th:if="${#lists.isEmpty(reports)}">
					<td colspan="6" class="empty">Chưa có báo cáo vi phạm nào trên hệ thống!</td>
				</tr>
			</tbody>
		</table>

		<div class="d-flex justify-content-center mt-3">
			<ul class="pagination" id="pagination"></ul>
		</div>

	</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
	const rows = document.querySelectorAll("#storyTable tr[data-lydo]");
	const pagination = document.getElementById("pagination");
	const rowLimitSelect = document.getElementById("rowLimit");
	const searchInput = document.getElementById("searchInput");
	const reasonFilter = document.getElementById("reasonFilter");

    let currentPage = 1;

	// Hàm cập nhật hiển thị bảng (Gộp chung cả Lọc Lý Do và Tìm Kiếm)
	function updateTable() {
        if(rows.length === 0) return;

        const keyword = searchInput.value.toLowerCase();
        const selectedReason = reasonFilter.value;
        
        let visibleRows = Array.from(rows);

        // 1. Lọc theo Keyword (Search)
        if (keyword !== "") {
            visibleRows = visibleRows.filter(row => {
                const tenTruyen = row.cells[0]?.textContent.toLowerCase() || "";
                const nguoiBaoCao = row.cells[1]?.textContent.toLowerCase() || "";
                return tenTruyen.includes(keyword) || nguoiBaoCao.includes(keyword);
            });
        }

        // 2. Lọc theo Lý Do (Select Dropdown)
        if (selectedReason !== "all") {
            visibleRows = visibleRows.filter(row => row.getAttribute("data-lydo") === selectedReason);
        }

        // Ẩn tất cả các dòng trước
        rows.forEach(row => row.style.display = "none");

        // 3. Cắt data theo Phân trang (Pagination)
		const limit = parseInt(rowLimitSelect.value);
		const start = (currentPage - 1) * limit;
		const end = start + limit;

		visibleRows.forEach((row, index) => {
			row.style.display = (index >= start && index < end) ? "" : "none";
		});

		setupPagination(visibleRows.length);
	}

    // Tạo các nút phân trang
	function setupPagination(totalVisibleRows) {
		pagination.innerHTML = "";
		const limit = parseInt(rowLimitSelect.value);
		const pageCount = Math.ceil(totalVisibleRows / limit);
        if (pageCount <= 1) return;

		const prev = document.createElement("li"); prev.className = "page-item";
		prev.innerHTML = `<a class="page-link" href="#">‹</a>`;
		if (currentPage === 1) { prev.style.pointerEvents = "none"; prev.style.opacity = "0.4"; }
		prev.onclick = (e) => { e.preventDefault(); if (currentPage > 1) { currentPage--; updateTable(); } };
		pagination.appendChild(prev);

		for (let i = 1; i <= pageCount; i++) {
			const li = document.createElement("li");
			li.className = "page-item " + (i === currentPage ? "active" : "");
			li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
			li.onclick = (e) => { e.preventDefault(); currentPage = i; updateTable(); };
			pagination.appendChild(li);
		}

		const next = document.createElement("li"); next.className = "page-item";
		next.innerHTML = `<a class="page-link" href="#">›</a>`;
		if (currentPage === pageCount) { next.style.pointerEvents = "none"; next.style.opacity = "0.4"; }
		next.onclick = (e) => { e.preventDefault(); if (currentPage < pageCount) { currentPage++; updateTable(); } };
		pagination.appendChild(next);
	}

    // Lắng nghe sự kiện người dùng
	searchInput.addEventListener("keyup", function() { currentPage = 1; updateTable(); });
    reasonFilter.addEventListener("change", function() { currentPage = 1; updateTable(); });
	rowLimitSelect.addEventListener("change", function() { currentPage = 1; updateTable(); });

    // Khởi chạy lần đầu
	updateTable();
});
</script>

</body>
</html>
