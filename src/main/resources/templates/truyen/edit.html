<div th:fragment="content">
<style>

label {
    display: block;
    margin-bottom: 6px; /* khoảng cách xuống input */
}

.d-flex.flex-wrap {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
}

.d-flex.flex-wrap label {
    display: flex;
    align-items: center;
    justify-content: flex-start; 
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #f9fafb;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 12px;
    text-align: left;
    width: 100%; 
    box-sizing: border-box;
}

.d-flex.flex-wrap label:hover {
    background: #eef2ff;
    border-color: #6366f1;
}

.d-flex.flex-wrap input[type="checkbox"] {
    display: none;
}

.d-flex.flex-wrap label::before {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 4px;
    transition: all 0.2s ease;
}

.d-flex.flex-wrap label:has(input:checked) {
    background: #4f46e5;
    color: #fff;
    border-color: #4f46e5;
}

.d-flex.flex-wrap label:has(input:checked)::before {
    content: "✔";
    font-size: 20px;
    color: #4f46e5;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

[data-theme="dark"] .d-flex.flex-wrap label {
    background: #2a2a2a;
    border: 1px solid #444;
    color: #ddd;
}

[data-theme="dark"] .d-flex.flex-wrap label:hover {
    background: #3a3a3a;
}

[data-theme="dark"] .d-flex.flex-wrap label:has(input:checked) {
    background: #6366f1;
    color: #fff;
}

/* ===== DARK MODE ===== */
[data-theme="dark"] .form-control,
[data-theme="dark"] .form-select {
    background: #2b2b2b;
    color: #eeeeee;
    border: 1px solid #444;
}

/* placeholder */
[data-theme="dark"] .form-control::placeholder {
    color: #888;
}

/* focus */
[data-theme="dark"] .form-control:focus,
[data-theme="dark"] .form-select:focus {
    background: #2b2b2b;
    color: #fff;
    border-color: #6366f1;
    box-shadow: 0 0 0 1px #6366f1;
}

/* label */
[data-theme="dark"] label {
    color: #ddd;
}

/* checkbox text */
[data-theme="dark"] .form-check-label {
    color: #ddd;
}

/* card */
[data-theme="dark"] .card {
    background: #1f1f1f;
    color: #eee;
}

/* border box preview */
[data-theme="dark"] .border {
    border-color: #444 !important;
    background: #2a2a2a !important;
}

#theLoaiContainer.hidden-theloai {
    display: none !important;
}

#theLoaiContainer {
    overflow: hidden;
    max-height: 1000px; 
    opacity: 1;
    transition: all 0.4s ease;
}

#theLoaiContainer.hide {
    max-height: 0;
    opacity: 0;
    pointer-events: none;
}

</style>

<script>
window.toggleTheLoaiFunc = function (e) {
	e.stopPropagation(); 
    e.preventDefault();
	
    const box = document.getElementById("theLoaiContainer");
    const icon = document.querySelector("#toggleTheLoai i");

    if (!box) return;

    box.classList.toggle("hide");

    if (box.classList.contains("hide")) {
        icon.classList.remove("bi-chevron-down");
        icon.classList.add("bi-chevron-right");
    } else {
        icon.classList.remove("bi-chevron-right");
        icon.classList.add("bi-chevron-down");
    }
};
</script>


<script>
let allChecked = false;

function toggleAllTheLoai() {
    const checkboxes = document.querySelectorAll('#theLoaiContainer input[type="checkbox"]');

    allChecked = !allChecked;

    checkboxes.forEach(cb => {
        cb.checked = allChecked;
    });
}
</script>


<div class="card">
    <div class="card-header">
        <h4>Sửa truyện</h4>
    </div>

    <div class="card-body">
       <form th:action="@{/DustNovel/truyen/sua/{id}(id=${truyen.id})}"
      th:object="${truyen}"
      method="post">
		<label>Tên truyện</label>
            <input th:field="*{tenTruyen}"
       class="form-control" style ="margin-bottom: 20px;"
       th:classappend="${#fields.hasErrors('tenTruyen')} ? 'is-invalid'">
<div class="invalid-feedback"
     th:errors="*{tenTruyen}"></div>
     
     	<label>Mô tả</label>
           <textarea th:field="*{moTa}"
          class="form-control" style ="margin-bottom: 20px;"
          th:classappend="${#fields.hasErrors('moTa')} ? 'is-invalid'"></textarea>

<div class="invalid-feedback"
     th:errors="*{moTa}"></div>

            <div class="mb-3">
                <label>Tên tác giả</label>
                <input type="text" th:field="*{tenTacGia}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Loại truyện</label>
                <select th:field="*{loaiTruyen}" class="form-select">
                    <option value="SÁNG_TÁC">Sáng tác</option>
                    <option value="DỊCH">Dịch</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label" style="cursor:pointer;" onclick="toggleAllTheLoai()">
                Thể loại
                <span id="toggleTheLoai" style="cursor:pointer;" onclick="toggleTheLoaiFunc(event)">
                   <i class="bi bi-chevron-down"></i>
                </span>
                </label>
                
                <div th:if="${error}" class="alert alert-danger">
                 <span th:text="${error}"></span>
                </div>

                <div id="theLoaiContainer" class="d-flex flex-wrap gap-2">
                    <label th:each="tl : ${dsTheLoai}"
                           class="badge bg-light text-dark border">

                        <input type="checkbox"
                               name="theLoaiIds"
                               th:value="${tl.id}"
                               th:checked="${truyen.theLoais.contains(tl)}">

                        <span th:text="${tl.tenTheLoai}"></span>
                    </label>
                </div>
            </div>

            <div class="mb-3">
                <label>Trạng thái</label>
                <select th:field="*{trangThai}" class="form-select">
                    <option value="ĐANG_RA">Đang ra</option>
                    <option value="HOÀN_THÀNH">Hoàn thành</option>
                </select>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" th:field="*{tag18}">
                <label class="form-check-label">Truyện 18+</label>
            </div>

            <div class="mb-3">
                <label class="form-label">Ảnh bìa (URL)</label>

                <input type="text"
                       th:field="*{anhBia}"
                       class="form-control"
                       oninput="previewAnhBia(this.value)">

                <div class="mt-3">
                    <div class="border rounded overflow-hidden"
                         style="width:180px; aspect-ratio:3/4;">
                        <img id="previewAnhBia"
                             th:src="*{anhBia}"
                             style="width:100%; height:100%; object-fit:cover;">
                    </div>
                </div>
            </div>

            <button class="btn btn-primary">Cập nhật truyện</button>
        </form>
    </div>
</div>
</div>

<script>
function previewAnhBia(url) {
    document.getElementById('previewAnhBia').src = url || '/images/default.jpg';
}
</script>
