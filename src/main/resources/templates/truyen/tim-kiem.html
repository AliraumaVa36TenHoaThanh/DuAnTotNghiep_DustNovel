<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">

    <h4 class="mb-3">
        🔍 Kết quả tìm kiếm cho:
        <span th:text="${keyword}"></span>
    </h4>

    <div class="row">
        <div class="col-md-3 mb-3" th:each="truyen : ${truyens}">
            <div class="card h-100">

          <!--     <img th:src="${truyen.tag18} 
                             ? 'https://i.pinimg.com/1200x/69/05/e3/6905e37f8ca8a420fd303393921ecec0.jpg' 
                             : (${truyen.anhBia != null && !#strings.isEmpty(truyen.anhBia)} 
                                ? ${truyen.anhBia} 
                                : @{/images/default.png})"
                     style="width:100%; aspect-ratio:9/11; object-fit:cover;"
                     class="rounded shadow"> --> 
					<div style="overflow: hidden; border-radius: 6px 6px 0 0; cursor:pointer;" th:onclick="${truyen.tag18} ? 'requireAgeGate(event, \'/DustNovel/truyen/' + ${truyen.id} + '\')' : 'window.location.href=\'/DustNovel/truyen/' + ${truyen.id} + '\''">
                            <img th:src="${truyen.anhBia != null && !#strings.isEmpty(truyen.anhBia)} ? ${truyen.anhBia} : @{/images/aria.jpg}"
                                 class="card-img-top rounded-top"
                                 style="aspect-ratio:5/6; object-fit:cover; transition: 0.3s;"
                                 th:styleappend="${truyen.tag18 != null and truyen.tag18} ? 'filter: blur(12px) brightness(0.85); transform: scale(1.1);' : ''">
                        </div>
                        
					 <div class="card-body d-flex flex-column">

					   <h6 class="card-title fw-bold"
    th:text="${#strings.length(truyen.tenTruyen) > 50 
        ? #strings.substring(truyen.tenTruyen, 0, 50) + '...' 
        : truyen.tenTruyen}">
</h6>

					     <small class="text-muted mb-1"
					            th:text="'Tác giả: ' + ${truyen.tenTacGia}">
					     </small>
					 	 <div class="mb-2 d-flex flex-wrap gap-1">

    <!-- chỉ hiện 4 -->
    <a th:each="tl, stat : ${truyen.theLoais}"
       th:if="${stat.index < 4}"
       th:href="@{/DustNovel/the-loai/{id}(id=${tl.id})}"
       th:text="${tl.tenTheLoai}"
       class="badge bg-secondary text-decoration-none">
    </a>

    <!-- nếu >4 thì hiện +x -->
    <span th:if="${#lists.size(truyen.theLoais) > 4}"
          class="badge bg-dark">
        +<span th:text="${#lists.size(truyen.theLoais) - 4}"></span>
    </span>

</div>
					     <small class="text-danger mb-2"
					            th:if="${truyen.tag18}">
					         🔞 Nội dung 18+
					     </small>

					     <a th:href="@{/DustNovel/truyen/{id}(id=${truyen.id})}"
					      th:onclick="${truyen.tag18} ? 'requireAgeGate(event, \'/DustNovel/truyen/' + ${truyen.id} + '\')' : ''"
					        class="btn btn-sm btn-outline-primary mt-auto">
					         Xem truyện
					     </a>

					 </div>
            </div>
        </div>
    </div>

    
        <div th:if="${#lists.isEmpty(truyens)}"
         class="alert alert-warning text-center">
        📭 Hiện chưa có truyện có tên bao gồm
        <strong th:text="${keyword}"></strong>
    </div>
	<div th:replace="~{truyen/XacMinhTuoi :: ageGate(${currentUser})}"></div>
</div>
