<div th:fragment="reportModal(truyen)">
    <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <form th:action="@{/DustNovel/bao-cao/gui}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title fw-bold">🚩 Báo cáo vi phạm</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    
                    <div class="modal-body text-dark">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small">Truyện bị báo cáo</label>
                            <input type="text" class="form-control bg-light text-danger fw-bold" 
                                   th:value="${truyen.tenTruyen}" readonly>
                            <input type="hidden" name="truyenId" th:value="${truyen.id}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small">Lý do báo cáo</label>
                            <select class="form-select border-danger" name="lyDo" id="reportReason" onchange="toggleReportDesc()" required>
                                <option value="" disabled selected>-- Chọn lý do --</option>
                                <option value="Dịch sai">Dịch sai / Dịch máy rác</option>
                                <option value="Dùng bìa truyện sai">Dùng bìa truyện sai / Phản cảm</option>
                                <option value="Ăn cắp truyện của người khác">Ăn cắp truyện của người khác</option>
                                <option value="Khác">Lý do Khác...</option>
                            </select>
                        </div>

                        <div class="mb-2 d-none" id="reportDescDiv">
                            <label class="form-label fw-bold text-muted small">Mô tả cụ thể (Bắt buộc)</label>
                            <textarea class="form-control border-danger" name="moTaChiTiet" id="reportDesc" rows="3" 
                                      placeholder="Vui lòng cung cấp link bằng chứng hoặc mô tả chi tiết lỗi..."></textarea>
                        </div>
                    </div>
                    
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary btn-sm px-3" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-danger btn-sm px-4 fw-bold">Gửi Báo Cáo</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleReportDesc() {
            const reason = document.getElementById('reportReason').value;
            const descDiv = document.getElementById('reportDescDiv');
            const descInput = document.getElementById('reportDesc');
            
            if (reason === 'Khác') {
                descDiv.classList.remove('d-none');
                descInput.setAttribute('required', 'required'); // Bắt buộc nhập
            } else {
                descDiv.classList.add('d-none');
                descInput.removeAttribute('required'); // Bỏ bắt buộc
                descInput.value = ''; // Xóa chữ cũ
            }
        }
    </script>
</div>
