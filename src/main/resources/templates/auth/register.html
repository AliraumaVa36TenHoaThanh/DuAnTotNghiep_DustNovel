<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký | DustNovel</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Merienda:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ===== BODY ===== */
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top, #1a0033, #000);
    overflow: hidden;
    color: #fff;
    font-family: 'none';
}

/* ===== STARS ===== */
.stars {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: -1;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite ease-in-out;
    opacity: 0.6;
}

.shooting-star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: shoot 3s linear infinite;
}

@keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
}

@keyframes shoot {
    0% { opacity: 1; transform: translate(-100px, -100px); }
    100% { opacity: 0; transform: translate(100vw, 100vh); }
}

/* ===== WRAPPER ===== */
.login-wrapper {
    display: flex;
    height: 100vh;
    justify-content: center;
    align-items: center;
}

/* ===== CARD GLASS ===== */
.login-card {
    display: flex;
    width: 900px;
    border-radius: 15px;
    overflow: hidden;
    background: rgba(20, 0, 40, 0.8);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 60px rgba(168, 85, 247, 0.5);
    border: 1px solid rgba(255,255,255,0.1);
}

/* ===== LEFT IMAGE ===== */
.login-left {
    width: 50%;
    background: url("/images/tanjiro.jpg") center/cover no-repeat;
    position: relative;
}

.login-left::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom right,
        rgba(0,0,0,0.6),
        rgba(88, 28, 135, 0.6)
    );
}

.login-left-content {
    position: absolute;
    bottom: 30px;
    left: 30px;
    z-index: 2;
}

.login-left h2 {
    font-family: 'Merienda', cursive;
    font-size: 32px;
    margin: 0;
    color: #fff;
}

.login-left p {
    font-size: 14px;
    margin-top: 5px;
    color: #ddd;
}

/* ===== RIGHT FORM ===== */
.login-right {
    width: 80%;
    padding: 40px;
    background: transparent;
    margin-right: 49px;
}

/* ===== TITLE ===== */
.login-title {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
}

.login-sub {
    color: #aaa;
    margin-bottom: 25px;
}

/* ===== LABEL ===== */
.form-label {
    color: #ccc;
    font-size: 13px;
}

/* ===== INPUT ===== */
.form-control {
    width: 130%;
    border-radius: 10px;
    padding: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    transition: 0.3s;
}

.form-control::placeholder {
    color: #aaa;
}

.form-control:focus {
    border-color: #a855f7;
    box-shadow: 0 0 12px #a855f7;
    background: rgba(255,255,255,0.08);
    color: #fff;
}

/* ===== BUTTON ===== */
.btn-primary {
    border-radius: 12px;
    padding: 14px;
    background: linear-gradient(90deg, #7c3aed, #d946ef);
    border: none;
    font-weight: 600;
    color: #fff;
    transition: 0.3s;
    margin-top: 25px;
}

.btn-primary:hover {
    box-shadow: 0 0 25px #d946ef;
    transform: translateY(-2px);
}

/* ===== FOOTER ===== */
.login-footer {
    margin-top: 45px;
    font-size: 13px;
    color: #aaa;
    margin-right: -46px;
}

.login-footer a {
    color: #d946ef;
    text-decoration: none;
}

.login-footer a:hover {
    text-decoration: underline;
}

/* ===== ALERT ===== */
.alert {
    background: rgba(255, 0, 0, 0.1);
    border: none;
    color: #ff6b6b;
    border-radius: 10px;
}

.auth-tabs {
    width: 112%;
    display: flex;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.35);
}

.tab-btn {
    flex: 1;
    text-align: center;
    padding: 10px 12px;
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-weight: 600;
    border: 1px solid transparent;
}

.tab-btn.active,
.tab-btn:hover {
    color: #fff;
    background: rgba(255,255,255,0.15);
}

.tab-btn.active {
    color: #23f4f0;
    background: rgba(124, 58, 237, 0.25);
}

.g-3, .gx-3 {
    --bs-gutter-x: 5rem;
}

.w-100 {
    width: 112% !important;
}
</style>
</head>

<body>

<!-- Animated Stars Background -->
<div class="stars" id="stars"></div>

<div class="login-wrapper">
    <div class="login-card">

        <!-- LEFT -->
        <div class="login-left">
            <div class="login-left-content">
                <h2>DustNovel</h2>
                <p>Khởi đầu mới của những câu chuyện</p>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="login-right">

            <div class="login-title">Đăng ký tài khoản</div>
            <div class="login-sub">Tạo tài khoản mới để bắt đầu</div>
            
            <div class="auth-tabs mb-3">
                <a href="/DustNovel/login" class="tab-btn active"><i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập</a>
                <a href="/DustNovel/register" class="tab-btn"><i class="bi bi-person-plus me-2"></i>Đăng ký</a>
            </div>

            <!-- Alerts -->
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>

            <div th:if="${success}" class="alert alert-success">
                <span th:text="${success}"></span>
            </div>

            <!-- FORM -->
            <form th:action="@{/DustNovel/register}"
                  method="post"
                  th:object="${nguoiDung}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-person"></i> Tên đăng nhập</label>
                            <input type="text"
                                   th:field="*{tenDangNhap}"
                                   class="form-control"
                                   placeholder="Ví dụ:Abc123"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-envelope"></i> Email</label>
                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   placeholder="Ví dụ:leo@gmail.com"
                                   required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-lock"></i> Mật khẩu</label>
                            <input type="password"
                                   th:field="*{matKhau}"
                                   class="form-control"
                                   placeholder="Ví dụ:Abc@1234"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-shield-lock"></i> Nhập lại mật khẩu</label>
                            <input type="password"
                                   name="reMatKhau"
                                   class="form-control"
                                   placeholder="Ví dụ:Abc@1234"
                                   required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-person-plus me-2"></i>
                    Đăng ký
                </button>
            </form>

            <!-- Footer -->
            <div class="login-footer text-center">
                <p>
                    Đã có tài khoản?
                    <a th:href="@{/DustNovel/login}">Đăng nhập</a>
                </p>

                <p>
                    <a th:href="@{/DustNovel/home}">Về trang chủ</a>
                </p>
            </div>

        </div>
    </div>
</div>

<script>
    // Generate stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.width = Math.random() * 3 + 1 + 'px';
        star.style.height = star.style.width;
        star.style.animationDelay = Math.random() * 2 + 's';
        starsContainer.appendChild(star);
    }

    // Generate shooting stars
    for (let i = 0; i < 5; i++) {
        const shootingStar = document.createElement('div');
        shootingStar.className = 'shooting-star';
        shootingStar.style.left = Math.random() * 100 + '%';
        shootingStar.style.top = Math.random() * 50 + '%';
        shootingStar.style.width = '2px';
        shootingStar.style.height = '2px';
        shootingStar.style.animationDelay = Math.random() * 10 + 's';
        shootingStar.style.animationDuration = (Math.random() * 2 + 2) + 's';
        starsContainer.appendChild(shootingStar);
    }
    
    const path = window.location.pathname;

    document.querySelectorAll('.tab-btn').forEach(tab => {
        if (tab.getAttribute('href') === path) {
            tab.classList.add('active');
        } else {
            tab.classList.remove('active');
        }
    });
</script>

</body>
</html>
