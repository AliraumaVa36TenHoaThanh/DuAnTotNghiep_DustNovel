<div xmlns:th="http://www.thymeleaf.org" th:fragment="content">
	<style>
/* ===== TEXT THEME ===== */

/* Light mode */
[data-theme="light"] .page-heading, [data-theme="light"] .card, [data-theme="light"] .form-label
	{
	color: #212529;
}

/* Dark mode */
[data-theme="dark"] .page-heading, [data-theme="dark"] .card, [data-theme="dark"] .form-label
	{
	color: #f1f1f1;
}

/* ===== INPUT NORMAL (đen nhạt) ===== */
[data-theme="dark"] .form-control {
	background: #2a2a2a;
	border-color: #444;
	color: #f1f1f1;
}

/* ===== INPUT DISABLED (đen đậm hơn) ===== */
[data-theme="dark"] .form-control:disabled {
	background: #1b1b1c;
	border-color: #333;
	color: #9a9a9a;
}

/* Card background */
[data-theme="dark"] .card {
	background: #1e1e1e;
}

/* Placeholder */
[data-theme="dark"] input::placeholder {
	color: #aaa;
}

/* ===== LIGHT MODE ===== */
[data-theme="light"] input[type=number]::-webkit-inner-spin-button,
[data-theme="light"] input[type=number]::-webkit-outer-spin-button {
    filter: invert(0);
    opacity: 1;
}

/* ===== DARK MODE ===== */
[data-theme="dark"] input[type=number]::-webkit-inner-spin-button,
[data-theme="dark"] input[type=number]::-webkit-outer-spin-button {
    filter: invert(1); /* đảo màu -> trắng */
    opacity: 1;
}

/* ===== VỊ TRÍ - LIGHT MODE ===== */
[data-theme="light"] select[name="viTri"] {
	background-color: #ffffff;
	color: #212529;
	border: 1px solid #ced4da;
}

/* ===== VỊ TRÍ - DARK MODE ===== */
[data-theme="dark"] select[name="viTri"] {
	background-color: #2a2a2a;
	color: #f1f1f1;
	border: 1px solid #444;
}

/* ===== DISABLED - LIGHT ===== */
[data-theme="light"] select[name="viTri"]:disabled {
	background-color: #e9ecef;
	color: #6c757d;
}

/* ===== DISABLED - DARK ===== */
[data-theme="dark"] select[name="viTri"]:disabled {
	background-color: #1b1b1c;
	color: #888;
	border-color: #333;
}

/* ===== SELECT TRUYỆN - LIGHT ===== */
[data-theme="light"] select[name="truyenId"] {
    background-color: #ffffff;
    color: #212529;
    border: 1px solid #ced4da;
}

/* ===== SELECT TRUYỆN - DARK ===== */
[data-theme="dark"] select[name="truyenId"] {
    background-color: #2a2a2a;
    color: #f1f1f1;
    border: 1px solid #444;
}

/* ===== OPTION (dropdown xổ ra) ===== */
[data-theme="dark"] select[name="truyenId"] option {
    background-color: #2a2a2a;
    color: #f1f1f1;
}

/* ===== DISABLED ===== */
[data-theme="light"] select[name="truyenId"]:disabled {
    background-color: #e9ecef;
    color: #6c757d;
}

[data-theme="dark"] select[name="truyenId"]:disabled {
    background-color: #1b1b1c;
    color: #888;
    border-color: #333;
}

[data-theme="light"] .form-control[readonly] {
	background-color: #e9ecef;
	border-color: #ced4da;
}

/* DARK MODE */
[data-theme="dark"] .form-control[readonly] {
	background: #1b1b1c;
	border-color: #333;
	color: #9a9a9a;
}

.readonly-select {
	pointer-events: none !important;
	background-color: #e9ecef !important;
	border-color: #ced4da !important;
}

[data-theme="light"] .readonly-select {
	pointer-events: none !important;
	cursor: not-allowed !important;
	opacity: 1 !important;
}

[data-theme="dark"] .readonly-select {
	pointer-events: none !important;
	background: #1b1b1c !important;
	border-color: #333 !important;
	color: #888 !important;
	opacity: 1 !important;
}

.token-badge {
	display: block; 
	margin-top: 8px; 
	width: fit-content; 
	display: inline-flex; 
	align-items: center;
	gap: 8px;
	padding: 12px 18px;
	border: 2px dashed #facc15;
	border-radius: 12px;
	color: #facc15;
	font-weight: 600;
	font-size: 15px;
	background: rgba(250, 204, 21, 0.05);
}

.token-badge i {
	font-size: 18px;
}

[data-theme="dark"] .token-badge {
	border-color: #facc15;
	color: #facc15;
	background: rgba(250, 204, 21, 0.08);
	margin-top: 22px;
	margin-left: 20px;
}

[data-theme="light"] .token-badge {
	border-color: #facc15;
	color: #b45309; 
	margin-top: 22px;
	margin-left: 20px;
}
</style>
	<div id="main">

		<div class="page-heading">

			<div class="page-title mb-4 text-center">
				<h3 class="text-primary fw-bold">
					<i class="bi bi-pencil-square"></i> Chỉnh sửa quảng cáo
				</h3>
				<p class="text-muted">Chỉ có thể tăng ngân sách và gia hạn ngày
					chạy</p>
			</div>

			<section class="section">

				<div class="card shadow-lg border-0 bg-light">

					<div class="card-header bg-primary text-white">
						<h5 class="mb-0">
							<i class="bi bi-arrow-repeat"></i> Cập nhật quảng cáo
						</h5>
					</div>

					<div class="card-body p-4">

						<form th:action="@{/quang-cao/update}" method="post">

							<input type="hidden" name="id" th:value="${banner.id}"> <input
								type="hidden" name="action" value="update">

							<div class="row g-3">

								<!-- TRUYEN -->
								<div class="col-md-6 mb-3">
								    <label class="form-label fw-bold">
								        <i class="bi bi-book text-primary"></i> Truyện
								    </label>

								    <!--  CHO_CHAY → cho sửa -->
								    <select th:if="${banner.trangThai == 'CHO_CHAY'}"
								            name="truyenId"
								            class="form-select form-select-lg">
											
										<option value="" disabled
											    th:selected="${banner.truyen == null}">
											      Chọn truyện
									    </option>

								        <option th:each="t : ${listTruyen}"
								                th:value="${t.id}"
								                th:text="${t.tenTruyen}"
								                th:selected="${banner.truyen.id == t.id}">
								        </option>

								    </select>

								    <!-- KHÔNG CHO SỬA -->
								    <input th:if="${banner.trangThai != 'CHO_CHAY'}"
								           type="text"
								           class="form-control form-control-lg"
								           th:value="${banner.truyen.tenTruyen}"
								           disabled>

								</div>

								<!-- VỊ TRÍ -->
								<div class="col-md-6 mb-3">
									<label class="form-label fw-bold"> <i
										class="bi bi-geo-alt text-success"></i> Vị trí
									</label> <select name="viTri" class="form-select form-select-lg"
										th:readonly="${banner.trangThai == 'HOAT_DONG'}"
										th:classappend="${banner.trangThai == 'HOAT_DONG'} ? 'readonly-select' : ''">

										<option value="" disabled
											th:selected="${banner.viTri == null}">Chọn vị trí</option>

										<option value="TOP" th:selected="${banner.viTri == 'TOP'}">
											Trang chủ (Đầu trang)</option>

										<option value="TRUYEN"
											th:selected="${banner.viTri == 'TRUYEN'}">Trong
											truyện (Dưới tiêu đề chương)</option>

									</select>
								</div>

								<!-- NGÀY BẮT ĐẦU -->
								<div class="col-md-6 mb-3">
									<label class="form-label fw-bold"> <i
										class="bi bi-calendar-event text-info"></i> Ngày bắt đầu
									</label> <input type="date" class="form-control form-control-lg"
										name="ngayBatDau"
										th:value="${ngayBatDau != null ? ngayBatDau : #temporals.format(banner.ngayBatDau,'yyyy-MM-dd')}"
										th:readonly="${banner.trangThai == 'HOAT_DONG' or banner.trangThai == 'TAM_DUNG'}">

									<p class="text-danger small mt-2" th:if="${errorStart}"
										th:text="${errorStart}"></p>
								</div>

								<!-- TOKEN MỖI NGÀY -->
								<div class="col-md-6 mb-3">
									<label class="form-label fw-bold"> <i
										class="bi bi-cash text-warning"></i> Token mỗi ngày :
									</label>

									<!-- HIỂN THỊ -->
									<div class="token-badge">
										<i class="bi bi-coin"></i> <span
											th:text="${banner.tokenMoiNgay + ' token / ngày'}"></span>
									</div>

									<!-- SUBMIT -->
									<input type="hidden" name="tokenMoiNgay"
										th:value="${banner.tokenMoiNgay}">

									<!-- ERROR -->
									<p class="text-danger small mt-2" th:if="${errorToken}"
										th:text="${errorToken}"></p>
								</div>

								<!-- NGÀY KẾT THÚC -->
								<div class="col-md-6 mb-3">
									<label class="form-label fw-bold"> <i
										class="bi bi-calendar-range text-primary"></i> Số ngày chạy
									</label> <input type="number" class="form-control form-control-lg"
										name="soNgayChay" min="1"
										th:value="${soNgayChay != null ? soNgayChay : 
                                                  T(java.time.temporal.ChronoUnit).DAYS.between(
                                                  banner.ngayBatDau.toLocalDate(), 
                                                  banner.ngayKetThuc.toLocalDate()
                                                  )}">

									<!-- ERROR -->
									<p class="text-danger small mt-2" th:if="${errorNgay}"
										th:text="${errorNgay}"></p>

									<small class="text-muted"> Số ngày sẽ được tính từ ngày
										bắt đầu </small>
								</div>

								<!-- TRẠNG THÁI -->
								<div class="col-md-6 mb-3">
									<label class="form-label fw-bold"> <i
										class="bi bi-info-circle text-secondary"></i> Trạng thái
									</label> <select class="form-control form-control-lg" name="trangThai"
										th:disabled="${banner.trangThai == 'CHO_CHAY'}">

										<option value="CHO_CHAY"
											th:if="${banner.trangThai == 'CHO_CHAY'}" th:selected="true">
											Chờ chạy</option>

										<option value="HOAT_DONG"
											th:selected="${banner.trangThai == 'HOAT_DONG'}">
											Hoạt động</option>

										<option value="TAM_DUNG"
											th:selected="${banner.trangThai == 'TAM_DUNG'}">Tạm
											dừng</option>

									</select>
								</div>
							</div>

							<div class="text-center mt-4">
								<i class="bi bi-check-circle-fill text-success fs-1"
									onclick="this.closest('form').submit()"
									style="cursor: pointer;" title="Cập nhật quảng cáo"></i>
							</div>

							<a th:href="@{/quang-cao/LichSu/QuangCao}"
								class="btn btn-secondary btn-lg" title="Quay lại"> <i
								class="bi bi-arrow-left-circle" style="font-size: 1rem;"></i>
							</a>
					</div>
				</form>
			</div>
		</div>
	</section>
	</div>
</div>
</div>
