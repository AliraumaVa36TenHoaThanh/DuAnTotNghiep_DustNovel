<div xmlns:th="http://www.thymeleaf.org" th:fragment="content">
	<style>
/* ===== TEXT THEME ===== */

/* Light mode */
[data-theme="light"] .page-heading, [data-theme="light"] .card, [data-theme="light"] .form-label
	{
	color: #212529;
}

/* Dark mode */
[data-theme="dark"] .page-heading, [data-theme="dark"] .card, [data-theme="dark"] .form-label
	{
	color: #f1f1f1;
}

/* ===== INPUT NORMAL (đen nhạt) ===== */
[data-theme="dark"] .form-control {
	background: #2a2a2a;
	border-color: #444;
	color: #f1f1f1;
}

/* ===== INPUT DISABLED (đen đậm hơn) ===== */
[data-theme="dark"] .form-control:disabled {
	background: #1b1b1c;
	border-color: #333;
	color: #9a9a9a;
}

/* Card background */
[data-theme="dark"] .card {
	background: #1e1e1e;
}

/* Placeholder */
[data-theme="dark"] input::placeholder {
	color: #aaa;
}

/* ===== LIGHT MODE ===== */
[data-theme="light"] input[type=number]::-webkit-inner-spin-button,
[data-theme="light"] input[type=number]::-webkit-outer-spin-button {
    filter: invert(0);
    opacity: 1;
}

/* ===== DARK MODE ===== */
[data-theme="dark"] input[type=number]::-webkit-inner-spin-button,
[data-theme="dark"] input[type=number]::-webkit-outer-spin-button {
    filter: invert(1); /* đảo màu -> trắng */
    opacity: 1;
}

/* ===== VỊ TRÍ - LIGHT MODE ===== */
[data-theme="light"] select[name="viTri"] {
	background-color: #ffffff;
	color: #212529;
	border: 1px solid #ced4da;
}

/* ===== VỊ TRÍ - DARK MODE ===== */
[data-theme="dark"] select[name="viTri"] {
	background-color: #2a2a2a;
	color: #f1f1f1;
	border: 1px solid #444;
}

/* ===== DISABLED - LIGHT ===== */
[data-theme="light"] select[name="viTri"]:disabled {
	background-color: #e9ecef;
	color: #6c757d;
}

/* ===== DISABLED - DARK ===== */
[data-theme="dark"] select[name="viTri"]:disabled {
	background-color: #1b1b1c;
	color: #888;
	border-color: #333;
}

/* ===== SELECT TRUYỆN - LIGHT ===== */
[data-theme="light"] select[name="truyenId"] {
    background-color: #ffffff;
    color: #212529;
    border: 1px solid #ced4da;
}

/* ===== SELECT TRUYỆN - DARK ===== */
[data-theme="dark"] select[name="truyenId"] {
    background-color: #2a2a2a;
    color: #f1f1f1;
    border: 1px solid #444;
}

/* ===== OPTION (dropdown xổ ra) ===== */
[data-theme="dark"] select[name="truyenId"] option {
    background-color: #2a2a2a;
    color: #f1f1f1;
}

/* ===== DISABLED ===== */
[data-theme="light"] select[name="truyenId"]:disabled {
    background-color: #e9ecef;
    color: #6c757d;
}

[data-theme="dark"] select[name="truyenId"]:disabled {
    background-color: #1b1b1c;
    color: #888;
    border-color: #333;
}

[data-theme="light"] .form-control[readonly] {
	background-color: #e9ecef;
	border-color: #ced4da;
}

/* DARK MODE */
[data-theme="dark"] .form-control[readonly] {
	background: #1b1b1c;
	border-color: #333;
	color: #9a9a9a;
}

.readonly-select {
	pointer-events: none !important;
	background-color: #e9ecef !important;
	border-color: #ced4da !important;
}

[data-theme="light"] .readonly-select {
	pointer-events: none !important;
	cursor: not-allowed !important;
	opacity: 1 !important;
}

[data-theme="dark"] .readonly-select {
	pointer-events: none !important;
	background: #1b1b1c !important;
	border-color: #333 !important;
	color: #888 !important;
	opacity: 1 !important;
}

.token-badge {
	display: block; 
	margin-top: 8px; 
	width: fit-content; 
	display: inline-flex; 
	align-items: center;
	gap: 8px;
	padding: 12px 18px;
	border: 2px dashed #facc15;
	border-radius: 12px;
	color: #facc15;
	font-weight: 600;
	font-size: 15px;
	background: rgba(250, 204, 21, 0.05);
}

.token-badge i {
	font-size: 18px;
}

[data-theme="dark"] .token-badge {
	border-color: #facc15;
	color: #facc15;
	background: rgba(250, 204, 21, 0.08);
	margin-top: 22px;
	margin-left: 20px;
}

[data-theme="light"] .token-badge {
	border-color: #facc15;
	color: #b45309; 
	margin-top: 22px;
	margin-left: 20px;
}

/* ===== DROPDOWN SEARCH TRUYỆN ===== */
.dropdown-list {
    border: 1px solid #ddd;
    border-radius: 5px;
    margin-top: 6px;
    max-height: 220px;
    overflow-y: auto;
    background: white;
    display: none;
    position: absolute;
    width: 98%;
    z-index: 999;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

/* item */
.page-heading .dropdown-item {
    padding: 12px 14px;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.2s ease;
}

/* hover */
.dropdown-item:hover {
    background: #eef2ff;
}

/* ===== DARK MODE ===== */
[data-theme="dark"] .dropdown-list {
    background: #2b2b2b;
    border: 1px solid #444;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

[data-theme="dark"] .dropdown-item {
    color: #ddd;
}

[data-theme="dark"] .dropdown-item:hover {
    background: #3b3b3b;
    color: #212529;
}

/* ===== SCROLLBAR ===== */
.dropdown-list::-webkit-scrollbar {
    width: 6px;
}

.dropdown-list::-webkit-scrollbar-track {
    background: transparent;
}

.dropdown-list::-webkit-scrollbar-thumb {
    background: #888;
    border-radius: 10px;
}

.dropdown-list::-webkit-scrollbar-thumb:hover {
    background: #667eea;
}

/* DARK scrollbar */
[data-theme="dark"] .dropdown-list::-webkit-scrollbar-thumb {
    background: #555;
}

[data-theme="dark"] .dropdown-list::-webkit-scrollbar-thumb:hover {
    background: #aaa;
}

.truyen-wrapper.has-error .dropdown-list {
    top: auto;
    bottom: calc(100% + 6px);
}

.col-md-6.mb-3:has(p.text-danger) #dropdownListUpdate {
    top: calc(44% + 24px);
    width: 98%;
    margin-left: -1px;
}

</style>


<script th:inline="javascript">
document.addEventListener("DOMContentLoaded", function () {

    let truyenList = [];

    const options = document.querySelectorAll("#hiddenSelectUpdate option");
    const input = document.getElementById("searchTruyenUpdate");
    const dropdown = document.getElementById("dropdownListUpdate");
    const hiddenInput = document.getElementById("truyenIdUpdate");

    if (!input) return;

    // ===== load data =====
    options.forEach(opt => {
        if (opt.value !== "") {
            truyenList.push({
                id: opt.value,
                name: opt.text
            });
        }
    });

    // ===== restore dữ liệu =====
    let selectedId = /*[[${truyenId}]]*/ null;
    let oldId = /*[[${banner.truyen.id}]]*/ null;

    let finalId = selectedId != null ? selectedId : oldId;
    let selectedName = "";

    if (finalId != null) {
        hiddenInput.value = finalId;
        options.forEach(opt => {
            if (opt.value == finalId) {
                input.value = opt.text;
                selectedName = opt.text;
            }
        });
    }

    // ===== render =====
    function renderList(list) {
        dropdown.innerHTML = "";

        if (list.length === 0) {
            dropdown.style.display = "none";
            return;
        }

        list.forEach(truyen => {
            const item = document.createElement("div");
            item.className = "dropdown-item";
            item.textContent = truyen.name;

            item.onclick = function () {
                input.value = truyen.name;
                hiddenInput.value = truyen.id;
                selectedName = truyen.name;
                dropdown.style.display = "none";
            };

            dropdown.appendChild(item);
        });

        dropdown.style.display = "block";
    }

    // ===== focus =====
    input.addEventListener("focus", function () {
        renderList(truyenList);
    });

    // ===== click =====
    input.addEventListener("click", function () {
        renderList(truyenList);
    });

    // ===== search =====
    input.addEventListener("input", function () {
        const keyword = input.value.toLowerCase().trim();

        if (input.value !== selectedName) {
            hiddenInput.value = "";
        }

        if (!keyword) {
            renderList(truyenList);
            return;
        }

        const filtered = truyenList.filter(t =>
            t.name.toLowerCase().includes(keyword)
        );

        renderList(filtered);
    });

    // ===== click ngoài =====
    document.addEventListener("click", function (e) {
        if (!e.target.closest("#searchTruyenUpdate") &&
            !e.target.closest("#dropdownListUpdate")) {
            dropdown.style.display = "none";
        }
    });
});
</script>

										<option value="" disabled
